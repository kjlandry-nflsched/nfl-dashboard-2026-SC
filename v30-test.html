<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Live Scoreboard V30 Test</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#0b0f17;color:#fff;margin:0;padding:24px}
.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{margin:0}.sub{color:#9fb0c8;margin-top:6px}.pill{padding:8px 12px;border-radius:999px;background:#3a1010;border:1px solid #ef4444;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px}
.card{border:1px solid #26344a;background:#121a27;border-radius:18px;padding:16px}.card.live{border-color:#ef4444;box-shadow:0 0 0 2px #ef444433}
.row{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:10px 0}.team{font-weight:800}.score{font-size:28px;font-weight:900}
.status{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.liveText{color:#f87171}.final{color:#86efac}.pre{color:#9fb0c8}
.meta{color:#9fb0c8;font-size:13px}.error{margin-top:20px;padding:16px;border:1px solid #ef4444;border-radius:14px;background:#3a1010}
button{background:#1d4ed8;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
</style>
</head><body><div class="wrap">
<div class="top"><div><h1>🔴 NFL Live Scoreboard — V30 Test</h1><div class="sub">Direct ESPN browser-feed validation. Refreshes every 20 seconds while a game is live.</div></div><div><span id="livePill" class="pill">Checking…</span> <button id="refresh">Refresh now</button></div></div>
<div id="meta" class="sub" style="margin-top:14px"></div><div id="grid" class="grid"></div>
</div>
<script>
const grid=document.getElementById('grid'),meta=document.getElementById('meta'),pill=document.getElementById('livePill');
let timer=null;
function url(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates='+y+m+day}
function state(e){return e?.status?.type?.state||'pre'}
function detail(e){return e?.status?.type?.shortDetail||e?.status?.type?.detail||''}
function comp(e){return e?.competitions?.[0]||{}}
function side(c,s){return (c.competitors||[]).find(x=>x.homeAway===s)||{}}
function card(e){const c=comp(e),a=side(c,'away'),h=side(c,'home'),st=state(e),net=(c.broadcasts?.[0]?.names||[]).join(' / ');return '<div class="card '+(st==='in'?'live':'')+'"><div class="status '+(st==='in'?'liveText':st==='post'?'final':'pre')+'">'+(st==='in'?'● LIVE':st==='post'?'FINAL':'UPCOMING')+' · '+detail(e)+'</div><div class="row"><div class="team">'+(a.team?.displayName||'Away')+'</div><div class="score">'+(a.score||0)+'</div></div><div class="row"><div class="team">'+(h.team?.displayName||'Home')+'</div><div class="score">'+(h.score||0)+'</div></div><div class="meta">'+(net||'NFL')+(c.venue?.fullName?' · '+c.venue.fullName:'')+'</div></div>'}
async function load(){try{const r=await fetch(url(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),events=Array.isArray(d.events)?d.events:[],live=events.filter(e=>state(e)==='in');grid.innerHTML=events.map(card).join('')||'<div class="error">No NFL games returned for today.</div>';meta.textContent=events.length+' NFL games today · '+live.length+' live · last checked '+new Date().toLocaleTimeString();pill.textContent=live.length?('LIVE · '+live.length+' game'+(live.length===1?'':'s')):'No live games';if(live.length&&!timer)timer=setInterval(load,20000);if(!live.length&&timer){clearInterval(timer);timer=null}}catch(e){grid.innerHTML='<div class="error">Live feed failed in this browser: '+e.message+'</div>';pill.textContent='Feed error';meta.textContent='This test tells us whether direct browser access to ESPN works from GitHub Pages.'}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
